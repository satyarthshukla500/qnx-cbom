# Configure target used to build OpenSSL 3.5.9 with qcc for QNX 8.0 (x86_64).
# Plain unix 64-bit target without the Linux-only parts (no afalg engine, no -ldl).
my %targets = (
    "qnx-generic64" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "qcc",
        cflags           => "-Vgcc_ntox86_64",
        lflags           => "-Vgcc_ntox86_64",
        ex_libs          => add("-lsocket"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        dso_scheme       => "dlfcn",
        thread_scheme    => "pthreads",
        shared_target    => "gnu-shared",
        shared_cflag     => "-fPIC",
        shared_extension => ".so.\$(SHLIB_VERSION_NUMBER)",
    },
);
